# ---------------------------------------------------------------------------
# One repo, one branch, TWO Netlify sites.
#
#   Public site   build command:  npm run build
#   Studio site   build command:  npm run build:studio
#
# The build command is deliberately NOT set here. Anything in netlify.toml
# overrides the site's UI settings, so hardcoding a command here would force
# both sites to build the same thing. Each site sets its own command in
# Site configuration -> Build & deploy -> Build settings.
#
# Base directory is empty for both — this is a single project at the repo root,
# not a monorepo.
#
# No secrets in this file. PUBLIC_SANITY_* go in each site's environment
# variables. SANITY_API_WRITE_TOKEN goes on NEITHER site — it is only used
# locally by `npm run seed`.
# ---------------------------------------------------------------------------

[build]
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
